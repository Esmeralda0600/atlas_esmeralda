[project]
name = "atlas"
version = "0.1.0"
description = "Visor de estrés térmico (UTCI/ERA5-HEAT) para México, estilo Thermal Trace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask>=2026.6.0",
    "faicons>=0.2.2",
    "geopy>=2.4.1",
    "ipyleaflet>=0.20.0",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.4",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "shiny>=1.6.3",
    "shinywidgets>=0.8.1",
    "xarray>=2026.4.0",
    "zarr>=3.2.1",
]

[project.scripts]
atlas-ingest = "atlas.cli:ingest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]
